<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lukks</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lukks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="phone.css">
<link rel="stylesheet" href="profile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,600&display=swap">
<style>
/* Layout: full-bleed 3D room, cream UI chrome on top, one circular control bottom-right. */
:root{
  --cream:#f4ead9; --cream-2:#ebdcc3; --ink:#2a1710; --ink-2:#6a5648;
  --maroon:#6b1a2b; --ochre:#d9a441; --line:rgba(42,23,16,.14);
  --disp:'Playfair Display',Georgia,'Times New Roman',serif;
  --cond:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px));
  --gx2:max(16px,env(safe-area-inset-right,0px));
  --nav-h:68px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#2a1a12;color:var(--ink);font-family:var(--body);position:relative;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.layer{position:absolute;left:0;right:0;pointer-events:none;padding-left:var(--gx);padding-right:var(--gx2)}
.layer>*{pointer-events:auto}

/* top */
#topfade{position:absolute;left:0;right:0;top:0;height:200px;pointer-events:none;background:linear-gradient(var(--cream) 0%,rgba(244,234,217,.94) 50%,rgba(244,234,217,0));transition:opacity .5s}
#top{top:0;padding-top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;transition:opacity .4s}
.brand b{display:block;font-family:var(--disp);font-weight:500;letter-spacing:.2em;font-size:19px}
.brand span{font-size:13px;color:var(--ink-2)}
.icons{display:flex;gap:6px}
.icons button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icons svg{width:25px;height:25px}
#hero{top:78px;transition:opacity .4s,transform .5s}
#hero h1{margin:0;font-family:var(--disp);font-weight:500;font-size:clamp(34px,9.4vw,60px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
#hero p{margin:10px 0 0;font-size:14px;color:var(--ink-2);max-width:34ch}
#crateTag{position:absolute;left:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--cream);font-size:13px;font-weight:600;padding:8px 14px 8px 11px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .3s;white-space:nowrap}
#crateTag i{width:9px;height:9px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 0 rgba(217,164,65,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 11px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}

/* browse hud */
#browse{top:0;padding-top:10px;padding-bottom:40px;background:linear-gradient(rgba(24,10,5,.62),rgba(24,10,5,0));text-align:center;opacity:0;visibility:hidden;transition:opacity .4s}
#browse .row{display:flex;align-items:center;justify-content:space-between}
#backBtn{width:44px;height:44px;border-radius:50%;background:rgba(244,234,217,.92);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#backBtn svg{width:22px;height:22px}
#bNum{font-family:var(--cond);font-size:22px;letter-spacing:.14em;color:var(--maroon);background:rgba(244,234,217,.92);padding:3px 12px;border-radius:99px}
#bTitle{margin:10px 0 0;font-family:var(--disp);font-weight:700;font-size:clamp(28px,8vw,44px);line-height:1.05;color:#fff7ea;text-shadow:0 2px 16px rgba(30,12,6,.65)}
#bTitle.pop{animation:pop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#bTag{margin:4px 0 0;font-family:var(--disp);font-style:italic;font-size:16px;color:#f6e7cb;text-shadow:0 1px 10px rgba(30,12,6,.7)}
.dots{position:absolute;right:calc(var(--gx2) - 4px);top:38vh;display:flex;flex-direction:column;gap:7px;opacity:0;transition:opacity .3s}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,247,234,.45);transition:all .25s}
.dots i.on{background:#fff7ea;height:18px;border-radius:4px}

/* bottom */
#bottom{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:0;padding-right:0}
#hintWrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 var(--gx2) 12px var(--gx);opacity:0;visibility:hidden;transition:opacity .4s;text-align:center}
#hint{font-size:13px;color:#fff3df;text-shadow:0 1px 8px rgba(30,12,6,.8)}
.pill{background:var(--ink);color:var(--cream);font-weight:600;font-size:15px;padding:13px 26px;border-radius:99px;box-shadow:0 8px 22px rgba(0,0,0,.4);min-height:46px}
.pill.alt{background:rgba(244,234,217,.94);color:var(--ink)}
#cratePick{display:flex;gap:10px;overflow-x:auto;padding:4px var(--gx2) 12px var(--gx);scrollbar-width:none;transition:opacity .4s,transform .4s}
#cratePick::-webkit-scrollbar{display:none}
.crateCard{flex:0 0 auto;min-width:148px;text-align:left;background:rgba(244,234,217,.94);border:1.5px solid transparent;border-radius:14px;padding:10px 14px 11px;box-shadow:0 4px 16px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:2px}
.crateCard.on{border-color:var(--maroon);background:#fbf3e4}
.spines{display:flex;gap:2px;height:16px;margin-bottom:5px}
.spines i{display:block;width:7px;border-radius:1px}
.crateCard .cn{font-family:var(--disp);font-weight:700;font-size:15px}
.crateCard .cb{font-size:12px;color:var(--ink-2)}
#nav{display:flex;justify-content:space-around;background:var(--cream);height:var(--nav-h);padding:6px max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18);transition:transform .45s}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--disp);font-size:14px;color:var(--ink);padding:5px 0;position:relative}
#nav button svg{width:26px;height:26px}
#nav button.on{color:var(--maroon)}
#nav button.on::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:2.5px;background:var(--maroon);border-radius:2px}

/* pulled + reading */
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 40%,rgba(20,8,4,.1),rgba(20,8,4,.62) 85%)}
#pulled{bottom:0;padding-top:46px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,8,4,0),rgba(20,8,4,.7));display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;visibility:hidden;transition:opacity .4s}
#pulled .btns{display:flex;gap:10px}
#pulled .meta{color:#fff3df;text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.7);font-size:13px}
#pulled .meta b{display:block;font-family:var(--disp);font-size:22px}
#read{top:0;padding-top:10px;opacity:0;visibility:hidden;transition:opacity .4s}
#read .row{display:flex;align-items:center;gap:12px}
#rClose{width:44px;height:44px;border-radius:50%;background:rgba(244,234,217,.94);display:grid;place-items:center;flex:0 0 auto}
#rClose svg{width:22px;height:22px}
#read .ttl{min-width:0;color:#fff3df;text-shadow:0 1px 10px rgba(0,0,0,.7)}
#read .ttl b{display:block;font-family:var(--disp);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#read .ttl span{font-size:12.5px;opacity:.9}
#readBot{bottom:calc(14px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .4s;display:flex;flex-direction:column;gap:12px;align-items:center}
#readBot .ctl{display:flex;align-items:center;gap:14px;width:100%;max-width:420px}
#readBot .ctl button{width:46px;height:46px;border-radius:50%;background:rgba(244,234,217,.94);display:grid;place-items:center;flex:0 0 auto}
#readBot .ctl button:disabled{opacity:.4}
#readBot .ctl svg{width:22px;height:22px}
#readBot #zoomBtn.on{background:var(--ochre)}
.bar{flex:1;height:4px;background:rgba(255,243,223,.3);border-radius:4px;overflow:hidden}
#rBar{height:100%;background:#fff3df;width:0}
#readHint{font-size:12.5px;color:#fff3df;text-shadow:0 1px 8px rgba(0,0,0,.8)}

body[data-mode=room] #hero,body[data-mode=room] #top{opacity:1}
body[data-mode=browse] #topfade,body[data-mode=pulling] #topfade,body[data-mode=pulled] #topfade,body[data-mode=reading] #topfade{opacity:0}
body[data-mode=browse] #hero,body[data-mode=browse] #top,body[data-mode=pulling] #hero,body[data-mode=pulling] #top,body[data-mode=pulled] #hero,body[data-mode=pulled] #top,body[data-mode=reading] #hero,body[data-mode=reading] #top{opacity:0;pointer-events:none;transform:translateY(-8px)}
body[data-mode=browse] #browse{opacity:1;visibility:visible}
body[data-mode=browse] .dots{opacity:1}
body[data-mode=browse] #hintWrap{opacity:1;visibility:visible}
body[data-mode=pulling] #cratePick,body[data-mode=pulled] #cratePick,body[data-mode=reading] #cratePick{opacity:0;pointer-events:none;transform:translateY(20px)}
body[data-mode=pulling] #nav,body[data-mode=pulled] #nav,body[data-mode=reading] #nav{transform:translateY(110%)}
body[data-mode=pulled] #vignette,body[data-mode=reading] #vignette{opacity:1}
body[data-mode=pulled] #pulled{opacity:1;visibility:visible}
body[data-mode=reading] #read,body[data-mode=reading] #readBot{opacity:1;visibility:visible}
body:not([data-mode=room]) #crateTag{display:none}
#phoneTag{position:absolute;left:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);font-size:13px;font-weight:600;padding:8px 12px 8px 11px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .3s;white-space:nowrap}
#phoneTag i{width:9px;height:9px;border-radius:50%;background:var(--maroon);animation:ping 1.8s infinite}
#phoneBadge{min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
#phoneBadge[hidden]{display:none}
body[data-mode=phone] #hero,body[data-mode=phone] #top,body[data-mode=phone] #topfade,body[data-mode=phone] #fab{opacity:0;pointer-events:none}
body[data-mode=phone] #nav{transform:translateY(110%)}
body[data-mode=phone] #cratePick,body[data-mode=phone] #phoneTag{opacity:0;pointer-events:none}
body:not([data-mode=room]) #phoneTag{pointer-events:none}
body[data-mode=browse] #cratePick .crateCard{box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* FAB */
#fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 118px + env(safe-area-inset-bottom,0px));width:62px;height:62px;z-index:5;transition:bottom .4s,opacity .3s}
body[data-mode=reading] #fab{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
body[data-mode=pulled] #fab,body[data-mode=pulling] #fab{opacity:0;pointer-events:none}
body[data-mode=browse] #fab{bottom:calc(var(--nav-h) + 205px + env(safe-area-inset-bottom,0px))}
#fab.hidden{display:none}
#fabRing{position:absolute;inset:0;border-radius:50%;background:rgba(244,234,217,.9);box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(107,26,43,.25)}
#fabKnob{position:absolute;inset:8px;border-radius:50%;background:var(--maroon);color:var(--cream);display:grid;place-items:center;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
#fabKnob svg{width:22px;height:22px;transition:transform .3s}
#fab.open #fabKnob svg{transform:rotate(45deg)}
#fabMenu{position:absolute;left:50%;top:50%;width:0;height:0}
.fabAct{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;box-shadow:0 5px 16px rgba(0,0,0,.35);opacity:0;transform:translate(0,0) scale(.4);pointer-events:none;transition:transform .32s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.fabAct svg{width:22px;height:22px}
.fabAct span{position:absolute;right:58%;top:50%;transform:translateY(-50%);padding-right:8px;white-space:nowrap;font-size:12px;font-weight:600;color:#fff3df;text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .2s;pointer-events:none}
#fab.open .fabAct{opacity:1;transform:translate(var(--x),var(--y)) scale(1);pointer-events:auto}
#fab.open .fabAct span{opacity:0}

/* sheet */
#sheet{position:absolute;inset:0;z-index:8;pointer-events:none;background:rgba(20,8,4,0);transition:background .35s}
#sheet.open{pointer-events:auto;background:rgba(20,8,4,.45)}
#sheetBox{position:absolute;left:0;right:0;bottom:0;max-height:88%;height:88%;background:var(--cream);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#sheet.open #sheetBox{transform:none}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gx2) 8px var(--gx)}
#sheetHead h2{margin:0;font-family:var(--disp);font-weight:700;font-size:24px}
#sheetClose{width:42px;height:42px;border-radius:50%;background:var(--cream-2);display:grid;place-items:center}
#sheetClose svg{width:20px;height:20px}
#sheetBody{overflow-y:auto;padding:4px var(--gx2) 28px var(--gx);flex:1;user-select:text;-webkit-user-select:text;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips button{flex:0 0 auto;padding:8px 15px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500}
.chips button.on{background:var(--maroon);color:var(--cream);border-color:var(--maroon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.tile canvas{width:100%;height:auto;aspect-ratio:3/4;border-radius:10px;display:block;box-shadow:0 3px 10px rgba(42,23,16,.15)}
.tile span{display:flex;flex-direction:column;gap:1px;min-width:0}
.tile b{font-family:var(--disp);font-size:15px;line-height:1.2}
.tile em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.tile u{text-decoration:none;font-size:13px;font-weight:600;color:var(--maroon)}
.tile.cur canvas{outline:2.5px solid var(--maroon);outline-offset:2px}
.more{display:block;margin:22px auto 4px;padding:12px 24px;border:1.5px solid var(--ink);border-radius:99px;font-weight:600}
.empty{color:var(--ink-2);padding:30px 4px;font-size:15px}
.lookView{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.lookView .hero{width:100%;max-width:340px;height:auto;aspect-ratio:3/4;border-radius:14px;margin:0 auto;display:block;box-shadow:0 8px 24px rgba(42,23,16,.25)}
.info h3{margin:0;font-family:var(--disp);font-size:28px;line-height:1.1}
.info p{margin:4px 0}
.info .by{color:var(--ink-2)}
.info .price{font-weight:700;font-size:20px;color:var(--maroon);margin-top:8px}
.info .fab{display:inline-block;background:var(--cream-2);padding:4px 12px;border-radius:99px;font-size:13px;margin:8px 0}
.info .desc{line-height:1.5;max-width:46ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts button{padding:12px 20px;border-radius:99px;border:1.5px solid var(--maroon);color:var(--maroon);font-weight:600}
.acts button.on{background:var(--maroon);color:var(--cream)}
.moreFrom{margin-top:26px}
.moreFrom h4{margin:0 0 12px;font-family:var(--disp);font-size:18px}
.moreFrom .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.moreFrom .tile{flex:0 0 128px}
@media(min-width:700px){.lookView{grid-template-columns:300px 1fr;align-items:start}.lookView .hero{margin:0}}

#loading{position:absolute;inset:0;z-index:20;background:var(--cream);display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#loading.gone{opacity:0;visibility:hidden}
#loading div{text-align:center;font-family:var(--disp)}
#loading b{display:block;letter-spacing:.24em;font-weight:500;font-size:24px}
#loading span{display:block;margin-top:8px;font-size:14px;color:var(--ink-2);font-family:var(--body)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-mode="room">
<canvas id="stage" aria-label="Interactive 3D Nigerian living room with a crate of fashion magazines"></canvas>
<div id="vignette"></div>
<div id="topfade"></div>

<div id="top" class="layer">
  <div class="brand"><b>LUKKS</b><span>Discover Nigerian fashion</span></div>
  <div class="icons">
    <button id="searchBtn" aria-label="Search looks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
    <button id="heartBtn" aria-label="Saved looks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20.5C5 15.5 3 12 3 9a4.8 4.8 0 0 1 9-2.3A4.8 4.8 0 0 1 21 9c0 3-2 6.5-9 11.5z"/></svg></button>
  </div>
</div>
<div id="hero" class="layer">
  <h1>Pick a magazine.<br>Find your look.</h1>
</div>
<button id="crateTag" type="button"><i></i><span id="tagBtn">Browse the crate</span></button>
<button id="phoneTag" type="button" aria-label="Pick up the phone"><i></i><span>Pick up the phone</span><b id="phoneBadge" hidden>0</b></button>

<div id="browse" class="layer">
  <div class="row"><button id="backBtn" aria-label="Back to room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg></button><span id="bNum">01 / 07</span><span style="width:44px"></span></div>
  <h2 id="bTitle">Ankara Now</h2>
  <p id="bTag">Seven ways to wear wax print</p>
</div>
<div class="dots"></div>

<div id="pulled" class="layer">
  <div class="meta"><b id="pTitle"></b><span id="pTag"></span></div>
  <div class="btns"><button id="openBtn" class="pill">Open magazine</button><button id="retBtn" class="pill alt">Return to crate</button></div>
</div>

<div id="read" class="layer">
  <div class="row"><button id="rClose" aria-label="Close magazine and return to crate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="ttl"><b id="rTitle"></b><span id="rPage">Cover</span></div></div>
</div>
<div id="readBot" class="layer">
  <div id="readHint">Drag a page to turn it. Tap a + on any outfit to open its collection.</div>
  <div class="ctl">
    <button id="rPrev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg></button>
    <div class="bar"><div id="rBar"></div></div>
    <button id="zoomBtn" aria-label="Zoom page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5M11 8v6M8 11h6"/></svg></button>
    <button id="rNext" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg></button>
  </div>
</div>

<div id="bottom" class="layer">
  <div id="hintWrap"><div id="hint">Drag down or up to flick through · tap to pull out</div><button id="pullBtn" class="pill">Pull out</button></div>
