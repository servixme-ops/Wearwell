<script>
/* if the app never starts (bad network, stale cache), clear saved copies once and reload */
setTimeout(function(){if(window.__ready)return;try{if(sessionStorage.getItem('ow_try'))return;sessionStorage.setItem('ow_try','1');}catch(e){}
 (navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}):Promise.resolve()).then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}):0;}).then(function(){location.reload();});},9000);
</script>
